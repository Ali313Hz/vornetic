name: Vornetic baseline checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript syntax
        run: |
          for f in server.js db.js catalog.js mail.js; do
            node --check "$f"
          done
      - name: Dependency advisory audit
        run: npm audit --audit-level=high --omit=dev
