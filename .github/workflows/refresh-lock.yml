name: Refresh dependency lockfile (temporary)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/dependency-security-2026-10
    paths:
      - package.json
      - .github/workflows/refresh-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh lockfile and verify dependencies
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm run check:syntax
          npm audit --audit-level=high --omit=dev
      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "fix: refresh audited npm lockfile"
          git push
