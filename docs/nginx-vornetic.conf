# Nginx for Vornetic — HTTPS in front of the Node app on the SAME server.
#
# Replace vornetic.com with your domain everywhere in this file, then (Ubuntu/Debian):
#   1. Free Let's Encrypt certificate first (the https blocks below need it to load). Nginx is
#      stopped for a few seconds; the hooks do the same automatically at every renewal:
#        sudo systemctl stop nginx
#        sudo certbot certonly --standalone -d vornetic.com -d www.vornetic.com \
#             --pre-hook "systemctl stop nginx" --post-hook "systemctl start nginx"
#        sudo systemctl start nginx
#   2. Install this file and remove the default site:
#        sudo cp nginx-vornetic.conf /etc/nginx/sites-available/vornetic
#        sudo ln -s /etc/nginx/sites-available/vornetic /etc/nginx/sites-enabled/vornetic
#        sudo rm -f /etc/nginx/sites-enabled/default
#        sudo nginx -t && sudo systemctl reload nginx
#   3. Check: http://vornetic.com redirects to https://vornetic.com, and `sudo certbot renew --dry-run` works.
#
# The app (NODE_ENV=production) listens on 127.0.0.1:3300 only and trusts X-Forwarded-Proto /
# X-Forwarded-For only from this machine. It serves customer requests only when Nginx reports
# https; a plain-http page is redirected and anything else is refused (403 "HTTPS required").
# .env must contain PUBLIC_URL=https://vornetic.com (the same address as server_name below).

# 1. Plain http (port 80): always redirect to https. Nothing is passed to the app over http.
server {
    listen 80;
    listen [::]:80;
    server_name vornetic.com www.vornetic.com;
    return 301 https://vornetic.com$request_uri;
}

# 2. Any other host name (e.g. someone pointing their domain at your server, or requests to the
#    bare IP): close the connection, so a faked Host header never reaches the app.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;     # nginx >= 1.19.4; no certificate is needed for this block
    server_name _;
    return 444;
}

# 3. https://www.vornetic.com -> https://vornetic.com (one address, matching PUBLIC_URL)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                    # nginx >= 1.25.1; on older versions use "listen 443 ssl http2;"
    server_name www.vornetic.com;
    ssl_certificate     /etc/letsencrypt/live/vornetic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vornetic.com/privkey.pem;
    return 301 https://vornetic.com$request_uri;
}

# 4. The shop
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vornetic.com;
    ssl_certificate     /etc/letsencrypt/live/vornetic.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vornetic.com/privkey.pem;

    client_max_body_size 100m;   # product photo/video uploads in the admin (the app allows 80 MB per file)

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (never append) what the visitor sent: the app trusts these from 127.0.0.1 only
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
